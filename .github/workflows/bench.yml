name: bench
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bench-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run bench
      # Self-check in the run log: what exactly is about to be published.
      - run: head -c 300 report/latest.json; echo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report
      # Pages rollout occasionally flaps with a transient "Deployment failed,
      # try again later" (seen on runs #2/#4). One in-workflow retry after a
      # cool-down absorbs it so nightly never needs a human.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
