name: bench
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run bench
      # Self-check in the run log: what exactly is about to be published.
      - run: head -c 300 report/latest.json; echo
      # Publish by force-pushing the report as the gh-pages branch. The Pages
      # deployment API silently failed to roll out on runs #2/#4/#5; branch
      # serving is the old, boring, reliable path and needs no environment.
      - name: Publish report to gh-pages
        run: |
          cd report
          git init -b gh-pages
          git config user.name "bench-bot"
          git config user.email "bench-bot@users.noreply.github.com"
          git add -A
          git commit -m "report: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
